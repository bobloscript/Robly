name: build

on:
  push:
  pull_request:

jobs:
  dist-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dist/robly.lua matches src/
        run: python3 tools/build.py --check
